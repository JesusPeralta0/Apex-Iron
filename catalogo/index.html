<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catalogo</title>
    <!-- favico -->
    <link rel="icon" type="image/x-icon" href="/res/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/res/logos/apex-simple.png">

    <!-- Estilos externos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Enlace a Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tipografía Lexend Deca (la usa el header) -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Estilos nuestros -->
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>


    <!--Componente Navbar-->
    <div id="contenedor-navbar"></div>

    <main>
        <!--hero catalogo-->
        <section class="hero-catalogo">
            <h1 class="visually-hidden">Catálogo de productos</h1>
            <div class="velo-bt hero py-4 d-flex align-items-center">
                <div class="container">
                    <div class="hero-caja p-4 p-lg-2">
                        <div class="row align-items-center">
                            <!--columna izquierda:titulo y cuerpo-->
                            <div class="col-lg-12">
                                <p class="hero-texto">¡SOLO ESTE BUEN FIN!</p>
                                <!--boton hero-->
                                <div class="hero-boton">
                                    <a href="#" class="btn btn-hero">¡Comprar ahora!</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="velo-tb categorias py-0 d-flex flex-column align-items-center">
            <h2 class="w-100 text-center text-apex-secondary py-5">Compras</h2>

            <div class="container">
                <div class="vidrio justify-content-center w-fit rounded-5 p-2 d-flex flex-wrap gap-4">
                    <div class="indicador rounded-pill"></div>
                    <div class="categoria text-apex-secondary activa rounded-pill w-fit px-2 py-1"
                        data-categoria="componentes-alto-rendimiento">
                        Componentes de alto rendimiento</div>
                    <div class="categoria text-apex-secondary w-fit rounded-pill px-2 py-1"
                        data-categoria="laptops-equipos-armados">
                        Laptops y
                        Equipos Armados</div>
                    <div class="categoria text-apex-secondary w-fit rounded-pill px-2 py-1"
                        data-categoria="perifericos-accesorios">
                        Periféricos y
                        Accesorios</div>
                </div>

                <div id="productos" class="row g-4 justify-content-center"></div>
        </section>

    </main>


    


<main>



</main>


    <!-- Footer-->
    <div id="footer-container"></div>
    <script src="/componentes/Footer/footer-loader.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/contacto.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/catalogo.js" type="module"></script>
    <script src="./js/categorias.js" type="module"></script>
    <script src="/componentes/navbar/navbar.js"></script>

    <script src="./js/ironcito-agente.js" type="module"></script>
</body>

</html>
