<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Apex-Iron</title>

    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="/res/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/res/logos/apex-simple.png">

    <!-- Bootstrap CSS y Fuentes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Estilos del Navbar y del Formulario de Contacto -->
    <link rel="stylesheet" href="./css/styles.css">
    <!-- Este es un parche cambiar a futuro en general -->
    <!-- <link rel="stylesheet" href="/contacto/css/contacto2.css"> -->
</head>
<body>

    <!-- Inyección automática de tu Navbar -->
    <div id="contenedor-navbar"></div>

    <!-- Contenedor principal centrado -->
    <main class="login container d-flex justify-content-center align-items-center py-5" style="min-height: 85vh;">
        <div class="vidrio card p-4" style="width: 100%; max-width: 450px;">
            <form id="formRegistro" novalidate>
                <h3 class="form-title text-white text-center mb-4">Crear Cuenta</h3>

                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input id="nombre" name="nombre" class="form-control" placeholder="Ej: Juan" required>
                        <div class="invalid-feedback">
                            Requerido
                        </div>
                        <small class="text-danger d-none" id="e-nombre">Requerido</small>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Apellido</label>
                        <input id="apellido" class="form-control" placeholder="Ej: Pérez">
                        <small class="text-danger d-none" id="e-apellido">Requerido</small>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input id="email" type="email" class="form-control" placeholder="tu@correo.com">
                    <small class="text-danger d-none" id="e-email"></small>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Número de teléfono</label>
                    <input id="telefono" type="tel" class="form-control" placeholder="Ej: 5512345678" maxlength="10">
                    <small class="text-danger d-none" id="e-telefono">Ingresa un número de teléfono válido de 10 dígitos</small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input id="pass" type="password" class="form-control" placeholder="Mínimo 8, con letra y número">
                    <small class="text-danger d-none" id="e-pass">Mínimo 8 caracteres, con letra y número</small>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Confirmar contraseña</label>
                    <input id="pass2" type="password" class="form-control" placeholder="Repite tu contraseña">
                    <small class="text-danger d-none" id="e-pass2">No coincide</small>
                </div>
                
                <button type="submit" class="btn btn-light w-100 fw-bold mt-2">Crear Cuenta</button>
            </form>

            <p class="mt-3 small text-center text-secondary">
                ¿Ya tienes cuenta? <a href="../login/index.html" class="text-white">Inicia Sesión</a>
            </p>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/componentes/navbar/navbar.js"></script>
    <script src="./js/registro.js"></script>
</body>
</html>
