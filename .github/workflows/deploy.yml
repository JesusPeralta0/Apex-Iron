name: Deploy al servidor

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Build project
      #   run: |
      #     npm install
      #     npm run build

      - name: Sync files to server via rsync
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          rsync -avzr --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 2285 -o StrictHostKeyChecking=no" \
            ./ \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/apexiron.carlosestrchz.me/html/"
