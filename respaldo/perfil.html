<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Apex-Iron</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family:'Lexend Deca', sans-serif; 
            min-height:100vh;
            background-color: #040632;
            background-image: 
                linear-gradient(125deg, 
                    #080b4a 0%, 
                    #080b4a 28%, 
                    #0e2d6b 28%, 
                    #105a8f 38%, 
                    #0e2d6b 48%, 
                    #080b4a 58%, 
                    #040632 100%);
            background-attachment: fixed;
            color: white;
        }
        .card-apex { background:rgba(30,30,30,0.95); border:1px solid #333; backdrop-filter: blur(10px); }
        .form-control::placeholder { color: #9aa0a6 !important; }
        label.lbl { color: #b0b0b0; font-size: 12px; margin-bottom: 5px; display: block; }
        .avatar { width:80px; height:80px; background:#fff; color:#000; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:600; }
    </style>
</head>
<body>
<div class="container py-5" style="max-width: 900px;">
  <a href="/index.html" class="text-white-50 text-decoration-none small mb-4 d-block"><i class="bi bi-arrow-left"></i> Volver a inicio</a>

  <div class="row g-4">
    <!-- CARD IZQ -->
    <div class="col-md-4">
      <div class="card card-apex p-4 text-center">
        <div class="d-flex justify-content-center mb-3">
          <div class="avatar" id="avatar">U</div>
        </div>
        <h5 class="text-white mb-1" id="p-nombre">Usuario</h5>
        <p class="small text-secondary mb-2" id="p-email">correo@ejemplo.com</p>
        <span class="badge bg-light text-dark mb-3" id="p-rol">cliente</span>
        <hr class="border-secondary">
        <button id="btnLogout" class="btn btn-outline-danger w-100 btn-sm"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button>
        <a href="/index.html" id="btnAdmin" class="btn btn-light w-100 btn-sm mt-2 d-none">Panel Admin</a>
      </div>
    </div>

    <!-- CARD DER -->
    <div class="col-md-8">
      <div class="card card-apex p-4 mb-4">
        <h6 class="text-white mb-3"><i class="bi bi-person"></i> Datos personales</h6>
        <form id="formPerfil">
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="lbl">Nombre</label>
              <input id="nombre" class="form-control bg-dark border-secondary text-white">
            </div>
            <div class="col-6">
              <label class="lbl">Apellido</label>
              <input id="apellido" class="form-control bg-dark border-secondary text-white">
            </div>
          </div>
          <div class="mb-3">
            <label class="lbl">Correo (no se puede cambiar)</label>
            <input id="email" class="form-control bg-dark border-secondary text-white" disabled>
          </div>
          <button class="btn btn-light btn-sm fw-bold">Guardar cambios</button>
          <small id="okPerfil" class="text-success d-none ms-2">Guardado ✓</small>
        </form>
      </div>

      <div class="card card-apex p-4">
        <h6 class="text-white mb-3"><i class="bi bi-lock"></i> Cambiar contraseña</h6>
        <form id="formPass">
          <div class="mb-2">
            <label class="lbl">Contraseña actual</label>
            <input id="passActual" type="password" class="form-control bg-dark border-secondary text-white" placeholder="Actual">
          </div>
          <div class="mb-2">
            <label class="lbl">Nueva contraseña</label>
            <input id="passNueva" type="password" class="form-control bg-dark border-secondary text-white" placeholder="Mínimo 8, letra y número">
          </div>
          <div class="mb-3">
            <label class="lbl">Confirmar nueva</label>
            <input id="passNueva2" type="password" class="form-control bg-dark border-secondary text-white" placeholder="Repite">
          </div>
          <small id="e-pass" class="text-danger d-none mb-2 d-block"></small>
          <small id="ok-pass" class="text-success d-none mb-2 d-block">Contraseña actualizada ✓</small>
          <button class="btn btn-outline-light btn-sm">Actualizar contraseña</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
const user = JSON.parse(localStorage.getItem('apex_user') || 'null');
if(!user){ window.location.href='/login.html'; }

function render(){
  document.getElementById('p-nombre').textContent = user.nombre + ' ' + (user.apellido||'');
  document.getElementById('p-email').textContent = user.email;
  document.getElementById('p-rol').textContent = user.rol;
  document.getElementById('avatar').textContent = (user.nombre||'U')[0].toUpperCase();
  document.getElementById('nombre').value = user.nombre||'';
  document.getElementById('apellido').value = user.apellido||'';
  document.getElementById('email').value = user.email||'';
  if(user.rol==='admin') document.getElementById('btnAdmin').classList.remove('d-none');
}
render();

// Guardar perfil
document.getElementById('formPerfil').addEventListener('submit',(e)=>{
  e.preventDefault();
  user.nombre = document.getElementById('nombre').value.trim();
  user.apellido = document.getElementById('apellido').value.trim();
  localStorage.setItem('apex_user', JSON.stringify(user));
  // actualizar también en lista de usuarios
  let usuarios = JSON.parse(localStorage.getItem('apex_usuarios')||'[]');
  usuarios = usuarios.map(u=> u.email===user.email ? {...u, nombre:user.nombre, apellido:user.apellido} : u);
  localStorage.setItem('apex_usuarios', JSON.stringify(usuarios));
  render();
  document.getElementById('okPerfil').classList.remove('d-none');
  setTimeout(()=>document.getElementById('okPerfil').classList.add('d-none'),2000);
});

// Cambiar pass - soporta btoa y texto plano
document.getElementById('formPass').addEventListener('submit',(e)=>{
  e.preventDefault();
  const actual = document.getElementById('passActual').value;
  const nueva = document.getElementById('passNueva').value;
  const nueva2 = document.getElementById('passNueva2').value;
  const err = document.getElementById('e-pass');
  const ok = document.getElementById('ok-pass');
  err.classList.add('d-none'); ok.classList.add('d-none');

  let usuarios = JSON.parse(localStorage.getItem('apex_usuarios')||'[]');
  let dbUser = usuarios.find(u=>u.email===user.email);

  const storedPass = dbUser ? dbUser.pass : user.pass;
  const actualOk = (storedPass===actual || storedPass===btoa(actual));

  if(!actualOk){ err.textContent='Contraseña actual incorrecta'; err.classList.remove('d-none'); return; }
  if(!/^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/.test(nueva)){ err.textContent='Nueva: mínimo 8, con letra y número'; err.classList.remove('d-none'); return; }
  if(nueva!==nueva2){ err.textContent='No coinciden'; err.classList.remove('d-none'); return; }

  const newPassStored = btoa(nueva);
  if(dbUser){ dbUser.pass = newPassStored; localStorage.setItem('apex_usuarios', JSON.stringify(usuarios)); }
  user.pass = newPassStored;
  localStorage.setItem('apex_user', JSON.stringify(user));
  ok.classList.remove('d-none');
  e.target.reset();
});

// Logout
document.getElementById('btnLogout').addEventListener('click',()=>{
  localStorage.removeItem('apex_user');
  window.location.href='/index.html';
});
</script>
</body>
</html>
