<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Apex-Iron</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family:'Lexend Deca', sans-serif; 
            min-height:100vh;
            /* FONDO IGUAL QUE INICIO Y REGISTRO */
            background-color: #040632;
            background-image: 
                linear-gradient(125deg, 
                    #080b4a 0%, 
                    #080b4a 28%, 
                    #0e2d6b 28%, 
                    #105a8f 38%, 
                    #0e2d6b 48%, 
                    #080b4a 58%, 
                    #040632 100%);
            background-attachment: fixed;
        }
        .form-control::placeholder { color: #9aa0a6 !important; opacity: 1 !important; }
        label.lbl { color: #b0b0b0; font-size: 12px; margin-bottom: 5px; display: block; }
        .form-control:focus { border-color: #fff !important; box-shadow: none !important; }
        .card-apex { background:rgba(30,30,30,0.95); border:1px solid #333; backdrop-filter: blur(10px); }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;">
  <div class="card p-4 card-apex" style="width:100%; max-width:400px;">
    <h3 class="text-white text-center mb-1">Iniciar Sesión</h3>
    <p class="text-secondary small text-center mb-4">Bienvenido de vuelta</p>
    
    <form id="formLogin" novalidate>
      <div class="mb-3">
        <label class="lbl">Correo electrónico</label>
        <input id="email" class="form-control bg-dark border-secondary text-white" placeholder="tu@correo.com">
      </div>
      <div class="mb-2">
        <label class="lbl">Contraseña</label>
        <input id="pass" type="password" class="form-control bg-dark border-secondary text-white" placeholder="Tu contraseña">
      </div>
      <small id="e-login" class="text-danger d-none mb-3 d-block" style="font-size:11px;"></small>
      
      <button type="submit" class="btn btn-light w-100 fw-bold">Entrar</button>
    </form>

    <div class="d-flex justify-content-between mt-3">
      <a href="/recuperar.html" class="small text-secondary text-decoration-none">¿Olvidaste tu contraseña?</a>
      <a href="/registro.html" class="small text-white text-decoration-none">Crear cuenta</a>
    </div>
    <a href="/index.html" class="small text-center text-secondary d-block mt-4 text-decoration-none">← Volver al inicio</a>
  </div>
</div>

<script>
document.getElementById('formLogin').addEventListener('submit',(e)=>{
  e.preventDefault();
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('pass').value;
  const err=document.getElementById('e-login');
  err.classList.add('d-none');

  // Admin para pruebas: admin@apexiron.mx / Admin123
  if(email==='admin@apexiron.mx' && pass==='Admin123'){
    localStorage.setItem('apex_user', JSON.stringify({nombre:'Admin', apellido:'Apex', email, rol:'admin'}));
    window.location.href='/index.html'; return;
  }

  const usuarios=JSON.parse(localStorage.getItem('apex_usuarios')||'[]');
  const u=usuarios.find(x=>x.email===email && x.pass===pass);
  if(!u){
    err.textContent='Correo o contraseña incorrectos'; 
    err.classList.remove('d-none'); 
    return;
  }
  localStorage.setItem('apex_user', JSON.stringify(u));
  window.location.href='/index.html';
});
</script>
</body>
</html>
