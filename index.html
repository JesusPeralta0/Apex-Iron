<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex-Iron</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fuente Lexend Deca -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- CSS  -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Apex-Iron-Inicio</h1>
        <!--Carla-->
    </header>
    <main>
        <!-- Hero Carrusel Lau-->
        <section class="hero py-5">
            <div class="container">
                <div class="hero-caja p-4 p-lg-5">
                    <div class="row aling-items-center g-4">
                        <!--columna izquierda:titulo y cuerpo-->
                        <div class="col-lg-5">
                            <h2 class="hero-titulo">Lleva tu rendimineto al siguiente nivel</h2>
                            <p class="hero-texto">Encuentra el hardware que necesitas o arma tu setup ideal desde cero
                            </p>
                            <a href="#" class="btn btn-hero">Ver equipos</a>
                        </div>
                        <!--columna derecha:carrusel-->
                        <div class="col-lg-7">
                            <div id="carruselEquipos" class="carousel slide" data-bs-ride="carousel">
                                <!-- Puntitos de abajo -->
                                <div class="carousel-indicators">
                                    <button type="button" data-bs-target="#carruselEquipos" data-bs-slide-to="0"
                                        class="active" aria-label="Slide 1"></button>
                                    <button type="button" data-bs-target="#carruselEquipos" data-bs-slide-to="1"
                                        aria-label="Slide 2"></button>
                                    <button type="button" data-bs-target="#carruselEquipos" data-bs-slide-to="2"
                                        aria-label="Slide 3"></button>
                                </div>
                                <!-- Imágenes -->
                                <div class="carousel-inner rounded-4">
                                    <div class="carousel-item active">
                                        <img src="src/img_hero/pc.png" class="d-block w-100" alt="PC ">
                                    </div>
                                    <div class="carousel-item">
                                        <img src="src/img_hero/monitor.png" class="d-block w-100" alt="monitor">
                                    </div>
                                    <div class="carousel-item">
                                        <img src="src/img_hero/ventilador.png" class="d-block w-100" alt="ventilador">
                                    </div>
                                </div>
                                <!-- Flechas -->
                                <button class="carousel-control-prev" type="button" data-bs-target="#carruselEquipos"
                                    data-bs-slide="prev">
                                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                    <span class="visually-hidden">Anterior</span>
                                </button>
                                <button class="carousel-control-next" type="button" data-bs-target="#carruselEquipos"
                                    data-bs-slide="next">
                                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                    <span class="visually-hidden">Siguiente</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>






       

    </main>
    <footer><!--Osvaldo--></footer>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
