<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto</title>
    <!-- favico -->
    <link rel="icon" type="image/x-icon" href="/res/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/res/logos/apex-simple.png">

    <!-- Estilos externos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Enlace a Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tipografía Lexend Deca (la usa el header) -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Estilos nuestros -->
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <!--Componente Navbar-->
    <div id="contenedor-navbar"></div>


    <main class="contacto py-5">
        <div class="container" style="max-width: 600px;">
            <h1 class="mb-4">Formulario de contacto</h1>

            <form id="formContacto" action="https://formspree.io/f/xoeevaqk" method="POST" novalidate>

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre:</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Escribe tu nombre">
                    <div class="invalid-feedback" id="error-nombre"></div>
                </div>

                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico:</label>
                    <input type="email" class="form-control" id="correo" name="email" placeholder="ejemplo@correo.com">
                    <div class="invalid-feedback" id="error-correo"></div>
                </div>

                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono:</label>
                    <input type="tel" class="form-control" id="telefono" name="telefono"
                        placeholder="10 dígitos, ej. 5571234567">
                    <div class="invalid-feedback" id="error-telefono"></div>
                </div>

                <div class="mb-3">
                    <label for="mensaje" class="form-label">Mensaje:</label>
                    <textarea class="form-control" id="mensaje" name="mensaje" rows="5"
                        placeholder="Escribe tu mensaje"></textarea>
                    <div class="invalid-feedback" id="error-mensaje"></div>
                </div>

                <button type="submit" class="btn btn-primary" id="btnEnviar">Enviar</button>

                <div id="estadoFormulario" class="mt-3" role="alert"></div>
            </form>
        </div>
    </main>

    <!-- Footer-->
    <div id="footer-container"></div>
    <script src="/componentes/Footer/footer-loader.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/contacto.js"></script>
    <script src="/componentes/navbar/navbar.js"></script>
</body>

</html>
