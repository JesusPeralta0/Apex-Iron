<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Apex-Iron</title>

    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="/res/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/res/logos/apex-simple.png">

    <!-- Bootstrap CSS y Fuentes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Estilos del Navbar y del Formulario de Contacto -->
    <link rel="stylesheet" href="./css/styles.css">
    <!-- Este es un parche cambiar a futuro en general -->
    <!-- <link rel="stylesheet" href="/contacto/css/contacto2.css"> -->
</head>

<body>

    <!-- Inyección automática de tu Navbar -->
    <div id="contenedor-navbar"></div>

    <!-- Contenedor principal centrado -->
    <main class="login container d-flex justify-content-center align-items-center" style="min-height: 85vh;">
        <div class="vidrio card p-4" style="width: 100%; max-width: 400px;">
            <form id="formLogin" novalidate>
                <h3 class="form-title text-white mb-1">Iniciar Sesión</h3>
                <p class="form-label small text-center mb-4">Bienvenido de vuelta</p>

                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input id="email" type="email" class="form-control"
                        placeholder="tu@correo.com">
                </div>
                <div class="mb-2">
                    <label for="pass" class="form-label">Contraseña</label>
                    <input id="pass" type="password" class="form-control"
                        placeholder="Tu contraseña" required>
                </div>
                <small id="e-login" class="text-danger d-none mb-3 d-block" style="font-size: 11px;"></small>

                <button type="submit" class="btn-apex-primary w-100 fw-bold mt-2">Entrar</button>
            </form>

            <div class="d-flex justify-content-between mt-3">
                <a href="/recuperar.html" class="small text-white text-decoration-none">¿Olvidaste tu
                    contraseña?</a>
                <a href="/registro/index.html" class="small text-white text-decoration-none">Crear cuenta</a>
            </div>
            <a href="/index.html" class="small text-center text-white d-block mt-4 text-decoration-none">← Volver al
                inicio</a>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/componentes/navbar/navbar.js"></script>
    <script src="./js/login.js"></script>
</body>

</html>
