<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Apex-Iron</title>

    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="/res/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/res/logos/apex-simple.png">

    <!-- Estilos del Navbar y del Formulario de Contacto -->
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <!-- Inyección automática de tu Navbar -->
    <div id="contenedor-navbar" class="sticky-top z-3"></div>

    <!-- Contenedor principal centrado -->
    <main class="login container d-flex justify-content-center align-items-center py-5" style="min-height: 85vh;">
        <div class="vidrio card p-4" style="width: 100%; max-width: 450px;">
            <form id="formRegistro" novalidate>
                <h3 class="form-title text-white text-center mb-4">Crear Cuenta</h3>

                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input id="nombre" name="nombre" class="form-control" placeholder="Ej: Juan" required>
                        <small class="text-danger d-none" id="e-nombre">Requerido</small>
                    </div>
                    <div class="col-6">
                        <label for="apellido" class="form-label">Apellido</label>
                        <input id="apellido" name="apellido" class="form-control" placeholder="Ej: Pérez" required>
                        <small class="text-danger d-none" id="e-apellido">Requerido</small>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input id="email" name="email" type="email" class="form-control" placeholder="tu@correo.com"
                        required>
                    <small class="text-danger d-none" id="e-email">Ingresa un correo válido</small>
                </div>

                <div class="mb-3">
                    <label for="telefono" class="form-label">Número de teléfono</label>
                    <input id="telefono" name="telefono" type="tel" class="form-control" placeholder="Ej: 5512345678"
                        maxlength="10" required>
                    <small class="text-danger d-none" id="e-telefono">Ingresa un número de teléfono válido de 10
                        dígitos</small>
                </div>

                <div class="mb-3">
                    <label for="pass" class="form-label">Contraseña</label>
                    <input id="pass" name="pass" type="password" class="form-control"
                        placeholder="Mínimo 8, con letra y número" required>
                    <small class="text-danger d-none" id="e-pass">Mínimo 8 caracteres, con letra y número</small>
                </div>

                <div class="mb-3">
                    <label for="pass2" class="form-label">Confirmar contraseña</label>
                    <input id="pass2" name="pass2" type="password" class="form-control"
                        placeholder="Repite tu contraseña" required>
                    <small class="text-danger d-none" id="e-pass2">No coincide</small>
                </div>

                <button type="submit" class="btn btn-light w-100 fw-bold mt-2">Crear Cuenta</button>
            </form>

            <p class="mt-3 small text-center text-secondary">
                ¿Ya tienes cuenta? <a href="/auth/login/" class="text-white">Inicia Sesión</a>
            </p>
        </div>
    </main>

    <!-- Footer-->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="./js/scripts.js" type="module"></script>
</body>

</html>
