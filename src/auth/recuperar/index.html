<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar Contraseña | Apex-Iron</title>

    <link rel="icon" type="image/x-icon" href="/res/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/res/logos/apex-simple.png">

    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <div id="contenedor-navbar"></div>

    <main class="login container d-flex justify-content-center align-items-center py-5"
        style="min-height: 85vh;">

        <div class="vidrio card p-4" style="width: 100%; max-width: 450px;">

            <form id="formRecuperar" novalidate>

                <h3 class="form-title text-white text-center mb-4">
                    Recuperar Contraseña
                </h3>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Correo electrónico
                    </label>

                    <input
                        id="email"
                        type="email"
                        class="form-control"
                        placeholder="tu@correo.com">

                    <small id="e-email" class="text-danger d-none"></small>
                </div>

                <div class="mb-3">
                    <label for="pass" class="form-label">
                        Nueva contraseña
                    </label>

                    <input
                        id="pass"
                        type="password"
                        class="form-control"
                        placeholder="Mínimo 8, con letra y número">

                    <small id="e-pass" class="text-danger d-none">
                        Mínimo 8 caracteres, con letra y número
                    </small>
                </div>

                <div class="mb-3">
                    <label for="pass2" class="form-label">
                        Confirmar contraseña
                    </label>

                    <input
                        id="pass2"
                        type="password"
                        class="form-control"
                        placeholder="Repite tu contraseña">

                    <small id="e-pass2" class="text-danger d-none">
                        Las contraseñas no coinciden
                    </small>
                </div>

                <button type="submit" class="btn btn-light w-100 fw-bold mt-2">
                    Cambiar Contraseña
                </button>

            </form>

            <p class="mt-3 small text-center text-secondary">
                ¿Recordaste tu contraseña?
                <a href="../login/" class="text-white">
                    Inicia Sesión
                </a>
            </p>

        </div>

    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/scripts.js" type="module"></script>

</body>

</html>
